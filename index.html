<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1411" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="אור המאיר" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://i.ytimg.com" />
    <style>
      /* Crawlable HTML stays in the document. With JS it must not take layout space, or the app swap shifts the page. */
      @media (scripting: enabled) {
        #root > .prerendered { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      }
    </style>
    <!--head-meta-->
    <title>אור המאיר — תורתו של הרב ליאור כהן</title>
    <meta name="description" content="ספריית שיעורים, דרשות, ספרים ותשובות של הרב ליאור כהן ומוסדות אור המאיר — לצפות, להאזין, לעיין ולשאול." />
    <!--/head-meta-->
    <script>
      /* Apply saved display preferences before first paint (preferences only; no secrets). Inlined so the first paint does not wait on a second request. */
      try {
        var p = JSON.parse(localStorage.getItem('prefs.v1') || '{}');
        if (p.theme === 'dark' || p.theme === 'light') document.documentElement.dataset.theme = p.theme;
        if (p.motion === 'reduce' || p.motion === 'full') document.documentElement.dataset.motion = p.motion;
        if (p.fontScale) document.documentElement.style.setProperty('--font-scale', String(p.fontScale));
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><!--prerender--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
